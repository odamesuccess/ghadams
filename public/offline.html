<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - GHADAMS</title>
    <meta name="theme-color" content="#020617">
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at top left, rgba(37, 99, 235, 0.28), transparent 35%),
                linear-gradient(135deg, #020617, #0f172a 55%, #111827);
            color: #f8fafc;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .card {
            width: min(100%, 460px);
            padding: 32px;
            border: 1px solid rgba(148, 163, 184, 0.28);
            border-radius: 24px;
            background: rgba(15, 23, 42, 0.92);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
            text-align: center;
        }

        .logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            margin-bottom: 18px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.08);
            padding: 8px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 1.65rem;
            letter-spacing: -0.03em;
        }

        p {
            margin: 0;
            color: #cbd5e1;
            line-height: 1.65;
        }

        .hint {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        button {
            margin-top: 24px;
            border: 0;
            border-radius: 999px;
            padding: 12px 20px;
            background: #2563eb;
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main class="card">
        <img class="logo" src="/images/ghadams_logo.jpg" alt="GHADAMS logo">
        <h1>You are offline</h1>
        <p>
            GHADAMS cannot connect to the server right now. Please check your internet connection and try again.
        </p>
        <p class="hint">
            Saved app files and icons are still available while offline.
        </p>
        <button type="button" onclick="window.location.reload()">Try Again</button>
    </main>
</body>
</html>
